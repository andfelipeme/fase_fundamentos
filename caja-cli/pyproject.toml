[project]
name = "caja-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andfelipeme", email = "andfelipeme@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
caja-cli = "caja_cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]      # errores, imports, bugs comunes, sintaxis moderna